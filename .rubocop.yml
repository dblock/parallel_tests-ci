plugins:
  - rubocop-md
  - rubocop-prose
  - rubocop-rake
  - rubocop-rspec
  - rubocop-spellcheck
  - rubocop-yaml

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  inherit_mode:
    merge:
      - Include
  Include:
    - '.github/**/*.yml'
    - '.github/**/*.yaml'
    - '.rubocop.yml'
  Exclude:
    - 'coverage/**/*'
    - 'pkg/**/*'
    - 'vendor/**/*'

YAML/Lint/InvalidSyntax:
  Include: &yaml_files
    - '**/*.yml'
    - '**/*.yaml'

YAML/Lint/DuplicateKey:
  Include: *yaml_files

Layout/LineLength:
  Enabled: false

Naming/FileName:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - '.github/workflows/*.yml'
    # Bundler requires the gem name by default.
    - lib/parallel_tests-ci.rb

Markdown/HeadingCapitalization:
  Enabled: true
  Style: title_case

Prose/MaxLength:
  Max: false
  Exclude:
    - LICENSE.txt

RSpec/Output:
  Exclude:
    # This installed-consumer executable reports success to its parent process.
    - spec/fixtures/consumer/verify.rb

RSpec:
  Exclude:
    # These synthetic suites run only in subprocesses, not in the unit spec runner.
    - 'spec/fixtures/suite/*.rb'

RSpec/ExampleLength:
  Max: 10

Metrics/ClassLength:
  Exclude:
    # Keep one persisted run lifecycle together instead of adding delegation-only classes.
    - lib/parallel_tests/ci/run.rb

Spellcheck:
  DictionaryFiles:
    en:
      - gem:rubocop-spellcheck/data/en/en.dic
      - '.spellcheck.txt'

Spellcheck/Spelling:
  Exclude:
    - LICENSE.txt
