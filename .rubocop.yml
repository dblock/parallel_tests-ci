plugins:
  - rubocop-md
  - rubocop-prose
  - rubocop-rake
  - rubocop-rspec
  - rubocop-spellcheck

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'coverage/**/*'
    - 'pkg/**/*'
    - 'vendor/**/*'

Naming/FileName:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    # Bundler requires the gem name by default.
    - lib/parallel_tests-ci.rb

Markdown/HeadingCapitalization:
  Enabled: true
  Style: title_case

Prose/MaxLength:
  Max: false
  Exclude:
    - LICENSE.txt

RSpec/Output:
  Exclude:
    # These installed-consumer executables report success to their parent process.
    - 'spec/parallel_tests/ci/*/consumer/verify.rb'
    - spec/parallel_tests/ci/consumer/verify_frameworks.rb

RSpec:
  Exclude:
    # These synthetic suites run only in subprocesses, not in the unit spec runner.
    - 'spec/parallel_tests/ci/rspec/suite/*.rb'

RSpec/ExampleLength:
  Max: 10

RSpec/SpecFilePathFormat:
  Exclude:
    # Framework-specific specs are grouped by framework before the class name.
    - 'spec/parallel_tests/ci/*/run_spec.rb'
    - 'spec/parallel_tests/ci/*/git_hub_spec.rb'

Metrics/ClassLength:
  Exclude:
    # Keep one persisted run lifecycle together instead of adding delegation-only classes.
    - lib/parallel_tests/ci/run.rb

Spellcheck:
  DictionaryFiles:
    en:
      - gem:rubocop-spellcheck/data/en/en.dic
      - '.spellcheck.txt'

Spellcheck/Spelling:
  Exclude:
    - LICENSE.txt
