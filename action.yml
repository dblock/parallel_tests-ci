name: Parallel Tests CI Shard Matrix
description: Assign RSpec or Minitest files to GitHub Actions matrix jobs using file sizes or past runtimes.
branding:
  icon: grid
  color: green
inputs:
  framework:
    description: Test framework, either rspec or minitest.
    default: rspec
  pattern:
    description: Repository-relative test glob; empty uses the selected framework's default.
    default: ''
  shards:
    description: Maximum number of shards, from 1 to 256.
    default: '4'
  runtime-log:
    description: Optional path to a local parallel_tests runtime log.
    default: ''
  group-by:
    description: Group by auto, filesize, or runtime.
    default: auto
outputs:
  matrix:
    description: JSON array of entries with a shard number and its assigned file paths.
    value: ${{ steps.plan.outputs.matrix }}
  group-by:
    description: Grouping method, either filesize or runtime.
    value: ${{ steps.plan.outputs.group-by }}
runs:
  using: composite
  steps:
    - name: Plan Test Shards
      id: plan
      shell: bash
      env:
        PTCI_ACTION_PATH: ${{ github.action_path }}
        PTCI_INPUTS: ${{ toJSON(inputs) }}
      run: bundle exec ruby "$PTCI_ACTION_PATH/script/shard_matrix.rb"
