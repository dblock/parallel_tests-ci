name: RSpec Shards

on:
  workflow_call:
    inputs:
      ruby-version:
        description: Ruby version (empty uses the caller's version file).
        type: string
        default: ''
      shards:
        description: Number of test shards (1-256), capped at the number of matching spec files.
        type: number
        default: 4
      worker-name:
        description: 'Worker display-name template with {shard.number}, {shard.count}, and {plan.group_by} placeholders.'
        type: string
        default: '{shard.number} of {shard.count}'
      pattern:
        description: Repository-relative glob selecting spec files.
        type: string
        default: spec/**/*_spec.rb
      rspec-options:
        description: JSON array of additional RSpec arguments.
        type: string
        default: '[]'
      environment:
        description: JSON object of non-secret environment variables.
        type: string
        default: '{}'
      before-bundle:
        description: Shell setup before installing Ruby/gems in every job.
        type: string
        default: ''
      setup:
        description: Shell setup after installing gems in each test shard.
        type: string
        default: ''
      artifacts:
        description: Additional artifact paths, such as coverage and failure screenshots.
        type: string
        default: ''
      artifact-prefix:
        description: Unique prefix when calling this workflow more than once.
        type: string
        default: parallel-tests-ci
    secrets:
      environment:
        description: Optional complete JSON environment object, replacing the non-secret environment input.
        required: false

permissions:
  contents: read
  actions: read

env: ${{ fromJSON(secrets.environment || inputs.environment) }}

jobs:
  prepare:
    name: Prepare Shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare System
        if: inputs.before-bundle != ''
        env:
          SETUP_SCRIPT: ${{ inputs.before-bundle }}
        run: bash -eo pipefail -c "$SETUP_SCRIPT"
      - name: Set Up Ruby
        uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564
        with:
          ruby-version: ${{ inputs.ruby-version || 'default' }}
          bundler-cache: true
      - name: Find Trusted History
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          PTCI_INPUTS: ${{ toJSON(inputs) }}
        run: >-
          bundle exec ruby -rparallel_tests/ci/github -e
          'ParallelTests::CI::GitHub.find_history(inputs: JSON.parse(ENV.fetch("PTCI_INPUTS")))'
      - name: Restore History
        if: steps.history.outputs.history_artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.history.outputs.history_artifact }}
          run-id: ${{ steps.history.outputs.history_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: tmp/parallel_tests_ci/history
      - name: Prepare Shared Plan
        id: plan
        env:
          PTCI_INPUTS: ${{ toJSON(inputs) }}
        run: >-
          bundle exec ruby -rparallel_tests/ci/github -e
          'ParallelTests::CI::GitHub.prepare(inputs: JSON.parse(ENV.fetch("PTCI_INPUTS")))'
      - name: Share Immutable Plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: tmp/parallel_tests_ci/plan/
          if-no-files-found: error
          retention-days: 30

  test:
    name: ${{ matrix.entry.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare System
        if: inputs.before-bundle != ''
        env:
          SETUP_SCRIPT: ${{ inputs.before-bundle }}
        run: bash -eo pipefail -c "$SETUP_SCRIPT"
      - name: Set Up Ruby
        uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564
        with:
          ruby-version: ${{ inputs.ruby-version || 'default' }}
          bundler-cache: true
      - name: Download Shared Plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: tmp/parallel_tests_ci/plan
      - name: Set Up Application
        if: inputs.setup != ''
        env:
          SETUP_SCRIPT: ${{ inputs.setup }}
        run: bash -eo pipefail -c "$SETUP_SCRIPT"
      - name: Run Assigned Specs
        id: run
        env:
          PTCI_INPUTS: ${{ toJSON(inputs) }}
          PTCI_SHARD: ${{ matrix.entry.shard }}
        run: >-
          bundle exec ruby -rparallel_tests/ci/github -e
          'ParallelTests::CI::GitHub.run(inputs: JSON.parse(ENV.fetch("PTCI_INPUTS")), shard: ENV.fetch("PTCI_SHARD"))'
      - name: Upload Measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.run.outputs.artifact }}
          path: tmp/parallel_tests_ci/result/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Test Artifacts
        if: always() && inputs.artifacts != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-test-${{ matrix.entry.shard }}-${{ github.run_attempt }}
          path: ${{ inputs.artifacts }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  collect:
    name: Collect Timings
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare System
        if: inputs.before-bundle != ''
        env:
          SETUP_SCRIPT: ${{ inputs.before-bundle }}
        run: bash -eo pipefail -c "$SETUP_SCRIPT"
      - name: Set Up Ruby
        uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564
        with:
          ruby-version: ${{ inputs.ruby-version || 'default' }}
          bundler-cache: true
      - name: Download Shared Plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: tmp/parallel_tests_ci/plan
      - name: Download Measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-shard-*
          path: tmp/parallel_tests_ci/results
      - name: Validate and Combine Measurements
        run: bundle exec ruby -rparallel_tests/ci/github -e 'ParallelTests::CI::GitHub.collect'
      - name: Publish Trusted Baseline
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-runtimes
          path: tmp/parallel_tests_ci/baseline/runtime.log
          if-no-files-found: error
          overwrite: true
          retention-days: 90
