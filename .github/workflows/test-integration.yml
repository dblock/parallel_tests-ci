name: Test Workflow Integration

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  rspec:
    name: Exercise RSpec Workflow
    uses: ./.github/workflows/rspec.yml
    with:
      ruby-version: '4.0'
      shards: 8
      worker-name: 'RSpec {shard.number}/{shard.count} ({plan.group_by})'
      pattern: spec/parallel_tests/ci/rspec/suite/*.rb
      test-options: '["--seed","123"]'
      artifact-prefix: integration-templates
      environment: '{"PTCI_OBSERVED":"tmp/parallel_tests_ci/observed.txt"}'
      artifacts: tmp/parallel_tests_ci/observed.txt

  minitest:
    name: Exercise Minitest Workflow
    uses: ./.github/workflows/minitest.yml
    with:
      ruby-version: '4.0'
      shards: 2
      pattern: spec/parallel_tests/ci/minitest/suite/*_test.rb
      test-options: '["--seed","123"]'
      worker-name: 'Minitest {shard.number}/{shard.count} ({plan.group_by})'
      environment: '{"PTCI_OBSERVED":"tmp/parallel_tests_ci/observed.txt"}'

  system_ruby:
    name: Exercise System Ruby
    uses: ./.github/workflows/minitest.yml
    with:
      ruby-version: system
      shards: 2
      pattern: spec/parallel_tests/ci/minitest/suite/*_test.rb
      artifact-prefix: integration-system-ruby
      artifact-retention-days: 1
      baseline-retention-days: 1
      environment: '{"PTCI_OBSERVED":"tmp/parallel_tests_ci/observed.txt"}'
      # Simulates a custom image that provides Ruby: puts the newest tool-cache Ruby on PATH without ruby/setup-ruby.
      before-bundle: |
        ruby_bin="$(ls -d /opt/hostedtoolcache/Ruby/*/x64 | sort -V | tail -n 1)/bin"
        echo "$ruby_bin" >> "$GITHUB_PATH"
        test "$("$ruby_bin/ruby" -e 'print Gem::Version.new(RUBY_VERSION) >= Gem::Version.new("3.3")')" = true
      setup: case "$(command -v ruby)" in /opt/hostedtoolcache/Ruby/*) ;; *) exit 1 ;; esac

  integration_configuration:
    name: Exercise Configuration (${{ matrix.entry.framework }}, ${{ matrix.entry.os }})
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { framework: rspec, pattern: 'spec/parallel_tests/ci/rspec/suite/*.rb', runner: '{"labels":["ubuntu-latest"]}', os: Linux, cache: false }
          - { framework: rspec, pattern: 'spec/parallel_tests/ci/rspec/suite/*.rb', runner: macos-latest, os: macOS, cache: true }
          - { framework: rspec, pattern: 'spec/parallel_tests/ci/rspec/suite/*.rb', runner: windows-latest, os: Windows, cache: false }
          - { framework: minitest, pattern: 'spec/parallel_tests/ci/minitest/suite/*_test.rb', runner: '["ubuntu-latest"]', os: Linux, cache: false }
          - { framework: minitest, pattern: 'spec/parallel_tests/ci/minitest/suite/*_test.rb', runner: macos-latest, os: macOS, cache: true }
          - { framework: minitest, pattern: 'spec/parallel_tests/ci/minitest/suite/*_test.rb', runner: windows-latest, os: Windows, cache: true }
    uses: ./.github/workflows/shards.yml
    with:
      framework: ${{ matrix.entry.framework }}
      runs-on: ${{ matrix.entry.runner }}
      timeout-minutes: 10
      max-parallel: 1
      fail-fast: true
      fetch-depth: 0
      ruby-version: '4.0'
      bundler-cache: ${{ matrix.entry.cache }}
      group-by: filesize
      shards: 2
      pattern: ${{ matrix.entry.pattern }}
      artifact-prefix: integration-configuration-${{ matrix.entry.framework }}-${{ matrix.entry.os }}
      artifact-retention-days: 1
      baseline-retention-days: 1
      environment: ${{ format('{{"PTCI_OBSERVED":"tmp/parallel_tests_ci/observed.txt","PTCI_EXPECTED_OS":"{0}"}}', matrix.entry.os) }}
      # Caller scripts run with the runner's default shell, so the Windows scripts are PowerShell.
      before-bundle: ${{ matrix.entry.os == 'Windows' && 'if ((git rev-parse --is-shallow-repository) -ne "false") { exit 1 }' || 'test "$(git rev-parse --is-shallow-repository)" = false' }}
      setup: ${{ matrix.entry.os == 'Windows' && 'if ($PSVersionTable.PSEdition -ne "Core" -or $env:RUNNER_OS -ne $env:PTCI_EXPECTED_OS) { exit 1 }' || 'test "$RUNNER_OS" = "$PTCI_EXPECTED_OS"' }}
      artifacts: tmp/parallel_tests_ci/observed.txt
