name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version overriding the checked-in version.
        type: string
        required: false
      rubygems-owner:
        description: RubyGems account ID for first publication.
        type: string
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release Gem
    if: github.ref == 'refs/heads/master'
    uses: dblock/ruby-gem-release/.github/workflows/release.yml@v0.6.0
    with:
      ruby-version: '4.0'
      version: ${{ inputs.version }}
      rubygems-owner: ${{ inputs.rubygems-owner }}
