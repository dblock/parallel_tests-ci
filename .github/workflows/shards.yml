name: Test Shards

on:
  workflow_call:
    inputs:
      framework:
        description: Test framework selected by the calling workflow.
        type: string
        required: true
      runs-on:
        description: Runner label or JSON array of labels for every job (Linux or macOS).
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Positive integer timeout for each preparation, worker, and collection job.
        type: number
        default: 360
      max-parallel:
        description: Maximum concurrent workers (1-256), subject to runner availability.
        type: number
        default: 256
      fail-fast:
        description: Cancel queued and running workers when a worker fails.
        type: boolean
        default: false
      fetch-depth:
        description: Checkout history depth in every job (0 fetches all history and tags).
        type: number
        default: 1
      ruby-version:
        description: Ruby version (empty uses the caller's version file).
        type: string
        default: ''
      bundler-cache:
        description: Cache installed gems in every job (false still runs bundle install).
        type: boolean
        default: true
      shards:
        description: Number of test shards (1-256), capped at the number of matching files.
        type: number
        default: 4
      worker-name:
        description: 'Worker display-name template with {shard.number}, {shard.count}, and {plan.group_by} placeholders.'
        type: string
        default: '{shard.number} of {shard.count}'
      group-by:
        description: Group by auto, filesize, or runtime.
        type: string
        default: auto
      pattern:
        description: Repository-relative glob selecting test files.
        type: string
        required: true
      test-options:
        description: JSON array of additional arguments for the selected test framework.
        type: string
        default: '[]'
      environment:
        description: JSON object of non-secret environment variables.
        type: string
        default: '{}'
      before-bundle:
        description: Shell setup before installing Ruby/gems in every job.
        type: string
        default: ''
      setup:
        description: Shell setup after installing gems in each test shard.
        type: string
        default: ''
      artifacts:
        description: Additional artifact paths, such as coverage and failure screenshots.
        type: string
        default: ''
      artifact-prefix:
        description: Unique prefix when calling this workflow more than once.
        type: string
        required: true
      artifact-retention-days:
        description: Retention for plans, measurements, and test artifacts (0 uses repository default).
        type: number
        default: 30
      baseline-retention-days:
        description: Retention for trusted timing history (0 uses repository default).
        type: number
        default: 90
    secrets:
      environment:
        description: Optional complete JSON environment object, replacing the non-secret environment input.
        required: false

permissions:
  contents: read
  actions: read

env: ${{ fromJSON(secrets.environment || inputs.environment) }}

jobs:
  prepare:
    name: Prepare Shards
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      - &checkout
        name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}
      - &prepare-system
        name: Prepare System
        if: inputs.before-bundle != ''
        env:
          SETUP_SCRIPT: ${{ inputs.before-bundle }}
        run: bash -eo pipefail -c "$SETUP_SCRIPT"
      - &setup-ruby
        name: Set Up Ruby
        uses: ruby/setup-ruby@v1 # Floating so new Ruby releases work without a parallel_tests-ci release.
        with:
          ruby-version: ${{ inputs.ruby-version || 'default' }}
          bundler-cache: ${{ inputs.bundler-cache }}
      - &install-gems
        name: Install Gems Without Cache
        if: ${{ !inputs.bundler-cache }}
        run: bundle install
      - name: Find Trusted History
        if: inputs.group-by == 'auto' || inputs.group-by == 'runtime'
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          PTCI_INPUTS: ${{ toJSON(inputs) }}
        run: >-
          bundle exec ruby -rparallel_tests/ci/github -e
          'ParallelTests::CI::GitHub.find_history(inputs: JSON.parse(ENV.fetch("PTCI_INPUTS")))'
      - name: Restore History
        if: steps.history.outputs.history_artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.history.outputs.history_artifact }}
          run-id: ${{ steps.history.outputs.history_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: tmp/parallel_tests_ci/history
      - name: Prepare Shared Plan
        id: plan
        env:
          PTCI_INPUTS: ${{ toJSON(inputs) }}
        run: >-
          bundle exec ruby -rparallel_tests/ci/github -e
          'ParallelTests::CI::GitHub.prepare(inputs: JSON.parse(ENV.fetch("PTCI_INPUTS")))'
      - name: Share Immutable Plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: tmp/parallel_tests_ci/plan/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  test:
    name: ${{ matrix.entry.name }}
    needs: prepare
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        entry: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - *checkout
      - *prepare-system
      - *setup-ruby
      - *install-gems
      - &download-plan
        name: Download Shared Plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: tmp/parallel_tests_ci/plan
      - name: Set Up Application
        if: inputs.setup != ''
        env:
          SETUP_SCRIPT: ${{ inputs.setup }}
        run: bash -eo pipefail -c "$SETUP_SCRIPT"
      - name: ${{ inputs.framework == 'minitest' && 'Run Assigned Tests' || 'Run Assigned Specs' }}
        id: run
        env:
          PTCI_INPUTS: ${{ toJSON(inputs) }}
          PTCI_SHARD: ${{ matrix.entry.shard }}
        run: >-
          bundle exec ruby -rparallel_tests/ci/github -e
          'ParallelTests::CI::GitHub.run(inputs: JSON.parse(ENV.fetch("PTCI_INPUTS")), shard: ENV.fetch("PTCI_SHARD"))'
      - name: Upload Measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.run.outputs.artifact }}
          path: tmp/parallel_tests_ci/result/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
      - name: Preserve Test Artifacts
        if: always() && inputs.artifacts != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-test-${{ matrix.entry.shard }}-${{ github.run_attempt }}
          path: ${{ inputs.artifacts }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}

  collect:
    name: Collect Timings
    needs: [prepare, test]
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - *checkout
      - *prepare-system
      - *setup-ruby
      - *install-gems
      - *download-plan
      - name: Download Measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-shard-*
          path: tmp/parallel_tests_ci/results
      - name: Validate and Combine Measurements
        run: bundle exec ruby -rparallel_tests/ci/github -e 'ParallelTests::CI::GitHub.collect'
      - name: Publish Trusted Baseline
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-runtimes
          path: tmp/parallel_tests_ci/baseline/runtime.log
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ inputs.baseline-retention-days }}
